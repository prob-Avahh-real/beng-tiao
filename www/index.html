<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#12140f" />
  <title>甭跳</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #12140f;
      --ink: #f2f4e8;
      --muted: #9aa38a;
      --line: rgba(242, 244, 232, 0.12);
      --go: #c8f135;
      --stop: #ff6b4a;
      --panel: rgba(242, 244, 232, 0.04);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --display: "Syne", "PingFang SC", sans-serif;
      --body: "IBM Plex Sans", "PingFang SC", sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100%;
      font-family: var(--body);
      color: var(--ink);
      background: var(--bg);
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background:
        radial-gradient(70% 50% at 10% -5%, rgba(200, 241, 53, 0.16), transparent 55%),
        radial-gradient(55% 40% at 100% 0%, rgba(255, 107, 74, 0.12), transparent 50%),
        repeating-linear-gradient(
          -12deg,
          transparent,
          transparent 18px,
          rgba(242, 244, 232, 0.02) 18px,
          rgba(242, 244, 232, 0.02) 19px
        ),
        linear-gradient(180deg, #1a1d14 0%, var(--bg) 48%, #0c0e0a 100%);
    }

    body[data-armed="0"] {
      background:
        radial-gradient(70% 50% at 10% -5%, rgba(255, 107, 74, 0.14), transparent 55%),
        radial-gradient(55% 40% at 100% 0%, rgba(154, 163, 138, 0.1), transparent 50%),
        repeating-linear-gradient(
          -12deg,
          transparent,
          transparent 18px,
          rgba(242, 244, 232, 0.02) 18px,
          rgba(242, 244, 232, 0.02) 19px
        ),
        linear-gradient(180deg, #1a1614 0%, var(--bg) 48%, #0c0e0a 100%);
    }

    .app {
      max-width: 440px;
      margin: 0 auto;
      min-height: 100dvh;
      padding: calc(20px + var(--safe-top)) 20px calc(28px + var(--safe-bottom));
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    .brand {
      animation: rise 0.7s ease both;
    }
    .brand h1 {
      font-family: var(--display);
      font-size: clamp(3rem, 14vw, 4.2rem);
      font-weight: 800;
      letter-spacing: -0.06em;
      line-height: 0.9;
    }
    .brand p {
      margin-top: 10px;
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.45;
      max-width: 28ch;
    }

    .hero-shield {
      position: relative;
      min-height: 42vh;
      display: grid;
      place-items: center;
      animation: rise 0.85s 0.08s ease both;
    }

    .shield {
      width: min(72vw, 280px);
      aspect-ratio: 1;
      border-radius: 50%;
      display: grid;
      place-items: center;
      position: relative;
      isolation: isolate;
    }
    .shield::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 1px solid var(--line);
      background: var(--panel);
      transition: background 0.4s ease, box-shadow 0.4s ease, border-color 0.4s ease;
    }
    .shield.on::before {
      border-color: rgba(200, 241, 53, 0.45);
      background:
        radial-gradient(circle at 40% 35%, rgba(200, 241, 53, 0.28), transparent 55%),
        var(--panel);
      box-shadow: 0 0 0 1px rgba(200, 241, 53, 0.08), 0 24px 60px rgba(200, 241, 53, 0.08);
      animation: pulse 2.8s ease-in-out infinite;
    }
    .shield.off::before {
      border-color: rgba(255, 107, 74, 0.35);
      background:
        radial-gradient(circle at 40% 35%, rgba(255, 107, 74, 0.18), transparent 55%),
        var(--panel);
    }
    .shield .mark {
      position: relative;
      z-index: 1;
      font-family: var(--display);
      font-weight: 800;
      font-size: clamp(2.4rem, 10vw, 3.2rem);
      letter-spacing: -0.05em;
      transition: color 0.35s ease, transform 0.35s ease;
    }
    .shield.on .mark { color: var(--go); transform: scale(1.02); }
    .shield.off .mark { color: var(--stop); }

    .status {
      position: relative;
      z-index: 1;
      margin-top: 8px;
      text-align: center;
      font-weight: 600;
      font-size: 1.05rem;
    }
    .a11y-hint {
      margin-top: 8px;
      text-align: center;
      color: var(--stop);
      font-size: 0.85rem;
    }

    .actions {
      display: grid;
      gap: 10px;
      animation: rise 0.9s 0.14s ease both;
    }
    .btn {
      appearance: none;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--ink);
      font: inherit;
      font-weight: 600;
      padding: 14px 16px;
      border-radius: 14px;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.2s ease, border-color 0.2s ease;
    }
    .btn:active { transform: scale(0.98); }
    .btn.primary {
      background: var(--go);
      color: #14160f;
      border-color: transparent;
    }
    body[data-armed="0"] .btn.primary {
      background: var(--stop);
      color: #fff;
    }
    .btn.row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      padding: 0;
      border: 0;
      background: transparent;
    }
    .btn.row > button {
      width: 100%;
    }
    .btn.active {
      border-color: rgba(200, 241, 53, 0.5);
      color: var(--go);
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1.4fr;
      gap: 12px;
      animation: rise 1s 0.2s ease both;
    }
    .stat {
      padding: 14px 0 4px;
      border-top: 1px solid var(--line);
    }
    .stat .label {
      color: var(--muted);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .stat .value {
      margin-top: 6px;
      font-family: var(--display);
      font-size: 1.55rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      word-break: break-all;
    }

    .log {
      animation: rise 1.05s 0.24s ease both;
    }
    .log h2 {
      font-family: var(--display);
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 10px;
    }
    .log ul {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .log li {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid var(--line);
      font-size: 0.9rem;
    }
    .log .when { color: var(--muted); white-space: nowrap; }
    .log .empty { color: var(--muted); border: 0; }

    .wear-note {
      color: var(--muted);
      font-size: 0.8rem;
      line-height: 1.4;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(24px + var(--safe-bottom));
      transform: translateX(-50%) translateY(20px);
      background: #1f2418;
      color: var(--ink);
      border: 1px solid var(--line);
      padding: 10px 16px;
      border-radius: 999px;
      font-size: 0.88rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
      z-index: 20;
      max-width: 90vw;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.03); }
    }

    @media (max-width: 280px), (max-height: 300px) {
      .app {
        padding: 8px;
        gap: 8px;
        min-height: 100%;
      }
      .brand h1 { font-size: 1.6rem; }
      .brand p { display: none; }
      .hero-shield { min-height: auto; }
      .shield { width: 88px; }
      .shield .mark { font-size: 1.2rem; }
      .status { font-size: 0.75rem; }
      .a11y-hint, .wear-note, .log, .stats .stat:last-child, #btnDemo, #btnClear, #btnWearable {
        display: none !important;
      }
      .actions { gap: 6px; }
      .btn { padding: 8px; font-size: 0.75rem; border-radius: 10px; }
      .stats { grid-template-columns: 1fr; }
      .stat .value { font-size: 1.1rem; }
    }
  </style>
</head>
<body data-armed="0">
  <main class="app">
    <header class="brand">
      <h1>甭跳</h1>
      <p>拦住应用打开后的跳转广告，以及强行拉起的另一个 App。</p>
    </header>

    <section class="hero-shield" aria-live="polite">
      <div id="shield" class="shield off">
        <div>
          <div class="mark">STOP</div>
          <div id="statusLabel" class="status">防护已关闭</div>
          <p id="a11yHint" class="a11y-hint">请先授权无障碍服务</p>
        </div>
      </div>
    </section>

    <section class="actions">
      <button type="button" class="btn primary" id="btnToggle" aria-pressed="false">开启防护</button>
      <div class="btn row">
        <button type="button" class="btn" id="btnA11y">无障碍设置</button>
        <button type="button" class="btn" id="btnWearable">接入穿戴</button>
      </div>
      <div class="btn row">
        <button type="button" class="btn" id="btnDemo">演示拦截</button>
        <button type="button" class="btn" id="btnClear">清空记录</button>
      </div>
      <p class="wear-note">戒指摇一摇 / 手杖轻点：开关防护。手表窄屏显示精简状态。</p>
    </section>

    <section class="stats">
      <div class="stat">
        <div class="label">已拦截</div>
        <div class="value" id="blockedCount">0</div>
      </div>
      <div class="stat">
        <div class="label">最近一次</div>
        <div class="value" id="lastBlocked">暂无</div>
      </div>
    </section>

    <section class="log">
      <h2>拦截日志</h2>
      <ul id="logList">
        <li class="empty">还没有拦截记录</li>
      </ul>
    </section>
  </main>

  <div id="toast" class="toast" role="status"></div>
  <script src="js/app.js"></script>
</body>
</html>
